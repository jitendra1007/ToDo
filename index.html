<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Cloud To-Do Checklist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
            --danger: #dc2626;
            --radius: 12px;
            --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--background); color: var(--text); line-height: 1.5; padding: 2rem 1rem; }
        .container { max-width: 800px; margin: 0 auto; background: var(--surface); padding: 2rem; border-radius: var(--radius); box-shadow: var(--shadow); }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        h1 { font-size: 1.75rem; font-weight: 700; }
        
        .header-badges { display: flex; gap: 0.5rem; align-items: center; }
        .metric-badge { background-color: #fee2e2; color: var(--danger); padding: 0.5rem 1rem; border-radius: 9999px; font-weight: 600; font-size: 0.875rem; }
        
        .sync-status { font-size: 0.825rem; font-weight: 500; padding: 0.4rem 0.8rem; border-radius: 6px; display: inline-flex; align-items: center; gap: 0.4rem; background-color: #f1f5f9; color: var(--text-muted); }
        .sync-status.active { background-color: #e0f2fe; color: #0369a1; }
        .sync-status.error { background-color: #fef2f2; color: var(--danger); }

        .controls { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .input-group { flex: 1; display: flex; gap: 0.5rem; min-width: 280px; }
        
        input[type="text"] { flex: 1; padding: 0.625rem 1rem; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 0.95rem; outline: none; }
        input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        button { padding: 0.625rem 1.25rem; border-radius: 6px; font-family: inherit; font-size: 0.95rem; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: var(--surface); color: var(--text-muted); border: 1px solid var(--border); }
        .btn-secondary:hover { background-color: var(--background); color: var(--text); }
        .btn-danger { background-color: transparent; color: var(--text-muted); padding: 0.375rem 0.75rem; }
        .btn-danger:hover { color: var(--danger); background-color: #fef2f2; }
        
        .data-actions { display: flex; gap: 0.5rem; margin-left: auto; }
        #importFile { display: none; }

        .table-container { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem; }
        th, td { padding: 1rem; border-bottom: 1px solid var(--border); }
        th { background-color: var(--background); color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
        tr:last-child td { border-bottom: none; }

        .col-status { width: 60px; text-align: center; }
        .col-task { width: auto; }
        .col-actions { width: 100px; text-align: right; }

        .checkbox-container { display: inline-flex; justify-content: center; align-items: center; position: relative; cursor: pointer; }
        .checkbox-container input { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }
        .checkmark { height: 20px; width: 20px; background-color: #fff; border: 2px solid var(--border); border-radius: 4px; transition: all 0.2s; display: inline-block; position: relative; }
        .checkbox-container:hover input ~ .checkmark { border-color: var(--primary); }
        .checkbox-container input:checked ~ .checkmark { background-color: var(--success); border-color: var(--success); }
        .checkmark:after { content: ""; position: absolute; display: none; left: 6px; top: 2px; width: 5px; height: 10px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
        .checkbox-container input:checked ~ .checkmark:after { display: block; }

        tr.completed .task-text { text-decoration: line-through; color: var(--text-muted); }
        tr.completed { background-color: #fafafa; }
        .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }

        @media (max-width: 640px) {
            body { padding: 1rem 0.5rem; }
            .container { padding: 1rem; }
            .controls { flex-direction: column; }
            .input-group { width: 100%; }
            .data-actions { width: 100%; justify-content: space-between; }
            .data-actions button { flex: 1; justify-content: center; }
        }
        .btn-danger-text:hover { color: var(--danger) !important; border-color: var(--danger) !important; background-color: #fef2f2; }
        .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="appScreen">
        <header>
            <div>
                <h1>To-Do Checklist</h1>
                <div id="syncStatusIndicator" class="sync-status">Offline</div>
            </div>
            <div class="header-badges">
                <div class="metric-badge"><span id="incompleteCount">0</span> remaining</div>
                <button id="authBtn" class="btn-primary btn-sm" onclick="handleAuthClick()">Connect Drive</button>
            </div>
        </header>

        <div class="controls">
            <form class="input-group" id="todoForm" onsubmit="addTask(event)">
                <input type="text" id="taskInput" placeholder="Add a new task..." required autocomplete="off">
                <button type="submit" class="btn-primary">Add Task</button>
            </form>
            
            <div class="data-actions">
                <button class="btn-secondary" onclick="exportData()">Export</button>
                <button class="btn-secondary" onclick="document.getElementById('importFile').click()">Import</button>
                <input type="file" id="importFile" accept=".json" onchange="importData(event)">
                <button class="btn-secondary btn-danger-text" onclick="clearAllData()">Clear Data</button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="col-status">Done</th>
                        <th class="col-task">Task Description</th>
                        <th class="col-actions">Actions</th>
                    </tr>
                </thead>
                <tbody id="todoTableBody"></tbody>
            </table>
            <div id="emptyState" class="empty-state" style="display: none;">No tasks found.</div>
        </div>
    </div>
</div>

<script>
    // =========================================================================
    // SECTION 1: TIMESTAMP-BASED DATA ARCHITECTURE
    // =========================================================================
    let databaseArray = []; // The generic container for all data envelopes

    document.addEventListener('DOMContentLoaded', () => {
        // We use a new storage key to start with a fresh slate for the new architecture
        const storedData = localStorage.getItem('generic_app_data');
        if (storedData) {
            try { databaseArray = JSON.parse(storedData); } catch (e) { databaseArray = []; }
        }
        render();
    });

    function updateDataState(newData, saveLocal = true) {
        databaseArray = newData;
        if (saveLocal) {
            localStorage.setItem('generic_app_data', JSON.stringify(databaseArray));
        }
        render();
    }

    function render() {
        const tbody = document.getElementById('todoTableBody');
        const emptyState = document.getElementById('emptyState');
        tbody.innerHTML = '';

        // UNPACKING: Filter for records that belong to 'tasks' and are NOT soft-deleted
        const visibleTasks = databaseArray.filter(record => record.table === 'tasks' && !record.deleted);

        if (visibleTasks.length === 0) {
            emptyState.style.display = 'block';
        } else {
            emptyState.style.display = 'none';
            visibleTasks.forEach(record => {
                const taskData = record.data; // The inner UI payload
                const tr = document.createElement('tr');
                if (taskData.completed) tr.classList.add('completed');
                tr.innerHTML = `
                    <td class="col-status">
                        <label class="checkbox-container">
                            <input type="checkbox" ${taskData.completed ? 'checked' : ''} onchange="toggleTask('${record.id}')">
                            <span class="checkmark"></span>
                        </label>
                    </td>
                    <td class="col-task"><span class="task-text">${escapeHTML(taskData.text)}</span></td>
                    <td class="col-actions"><button class="btn-danger" onclick="deleteTask('${record.id}')">Delete</button></td>
                `;
                tbody.appendChild(tr);
            });
        }
        updateMetric(visibleTasks);
    }

    function updateMetric(visibleTasks) {
        document.getElementById('incompleteCount').textContent = visibleTasks.filter(r => !r.data.completed).length;
    }

    function addTask(event) {
        event.preventDefault();
        const input = document.getElementById('taskInput');
        const text = input.value.trim();
        if (!text) return;

        // PACKING: Wrap the task in the Data Envelope
        databaseArray.push({
            id: "tsk_" + Date.now().toString(36) + Math.random().toString(36).substr(2, 5),
            table: "tasks", 
            updatedAt: Date.now(), 
            deleted: false,
            data: { text: text, completed: false }
        });
        
        updateDataState(databaseArray, true);
        input.value = '';
        autoUploadToCloud();
    }

    function toggleTask(id) {
        // Find the envelope, update the outer timestamp, toggle inner status
        databaseArray = databaseArray.map(record => 
            record.id === id 
                ? { ...record, updatedAt: Date.now(), data: { ...record.data, completed: !record.data.completed } } 
                : record
        );
        updateDataState(databaseArray, true);
        autoUploadToCloud();
    }

    function deleteTask(id) {
        // SOFT DELETE: We do not filter it out! We flag it as deleted and update the timestamp.
        databaseArray = databaseArray.map(record => 
            record.id === id ? { ...record, deleted: true, updatedAt: Date.now() } : record
        );
        updateDataState(databaseArray, true);
        autoUploadToCloud();
    }

    function exportData() {
        if (!databaseArray.length) return alert("No data to export.");
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(databaseArray, null, 2));
        const a = document.createElement('a'); a.setAttribute("href", dataStr); a.setAttribute("download", "todo_export.json"); a.click();
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const parsed = JSON.parse(e.target.result);
                if (Array.isArray(parsed)) { updateDataState(parsed, Date.now(), true); autoUploadToCloud(); }
            } catch(err) { alert("Invalid JSON file."); }
        };
        reader.readAsText(file);
        event.target.value = '';
    }
    function clearAllData() {
        if (!confirm("Are you sure you want to delete all tasks? This will wipe your local screen and your cloud backup instantly.")) return;
        // Soft delete all task records
        databaseArray = databaseArray.map(record => 
            record.table === 'tasks' ? { ...record, deleted: true, updatedAt: Date.now() } : record
        );
        updateDataState(databaseArray, true);
        autoUploadToCloud();
    }
    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
    }

    // =========================================================================
    // SECTION 2: TOKEN-CACHED REALTIME CLOUD SYNC ENGINE
    // =========================================================================
    const CLIENT_ID = '305632493984-9q07n0i677ku1btdds1scke8pam5ag3s.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.appdata';

    let tokenClient;
    let gapiInited = false;
    let gisimInited = false;
    let accessToken = null;
    let cloudFileId = null;
    let silentRefreshTimeout = null;

    function setSyncStatus(text, type = '') {
        const el = document.getElementById('syncStatusIndicator');
        if (el) {
            el.innerText = text;
            el.className = 'sync-status ' + type;
            
            // Automatically remove the clickable state when things are working normally
            if (type !== 'error') {
                el.style.cursor = 'default';
                el.onclick = null;
            }
        }
    }

    function gapiLoaded() {
        gapi.load('client', async () => {
            await gapi.client.init({ discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] });
            gapiInited = true;
            evaluateRoutingSession();
        });
    }

    function gisLoaded() {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPES,
            callback: async (resp) => {
                
                if (silentRefreshTimeout) {
                    clearTimeout(silentRefreshTimeout);
                    silentRefreshTimeout = null;
                }

                if (resp.error !== undefined) {
                    triggerReconnectState();
                    return;
                }
                
                accessToken = resp.access_token;
                gapi.client.setToken({ access_token: accessToken });
                
                localStorage.setItem('google_access_token', accessToken);
                localStorage.setItem('google_token_expiry', (Date.now() + (resp.expires_in * 1000)).toString());
                localStorage.setItem('has_linked_google', 'true');
                
                updateAuthUI(true);
                setSyncStatus("Cloud Synced ✅", "active");
                
                const statusEl = document.getElementById('syncStatusIndicator');
                if(statusEl) { statusEl.style.cursor = 'default'; statusEl.onclick = null; }
                
                await pullAndMergeCloudData();
            },
        });
        gisimInited = true;
        evaluateRoutingSession();
    }
    window.addEventListener('load', () => { gapiLoaded(); gisLoaded(); });

    function evaluateRoutingSession() {
        if (!gapiInited || !gisimInited) return;

        if (localStorage.getItem('has_linked_google') === 'true') {
            const cachedToken = localStorage.getItem('google_access_token');
            const expiry = parseInt(localStorage.getItem('google_token_expiry') || '0');

            if (cachedToken && Date.now() < expiry) {
                // TOKEN IS VALID
                accessToken = cachedToken;
                gapi.client.setToken({ access_token: accessToken });
                updateAuthUI(true);
                setSyncStatus("Cloud Synced ✅", "active");
                pullAndMergeCloudData(); 
            } else {
                // TOKEN EXPIRED: Attempt silent refresh
                updateAuthUI(true);
                setSyncStatus("Reconnecting...", "active");
                
                silentRefreshTimeout = setTimeout(() => {
                    console.warn("Silent refresh timed out. Forcing manual reconnect button.");
                    triggerReconnectState();
                }, 4000);

                tokenClient.requestAccessToken({ prompt: 'none' }); 
            }
        } else {
            // NEVER CONNECTED OR DISCONNECTED
            updateAuthUI(false);
        }
    }
    function triggerReconnectState() {
        const statusEl = document.getElementById('syncStatusIndicator');
        setSyncStatus("Session Expired - Tap to Reconnect 🔄", "error");
        
        // Turn the indicator into a clickable button to bypass mobile pop-up blockers
        statusEl.style.cursor = "pointer";
        statusEl.onclick = () => {
            setSyncStatus("Connecting...", "active");
            // Firing a standard request (without prompt: 'none') is allowed by mobile OS
            tokenClient.requestAccessToken({ prompt: '' }); 
        };
    }

function handleAuthFailure() {
        localStorage.removeItem('google_access_token');
        updateAuthUI(false);
    }
    function updateAuthUI(isConnected) {
        const authBtn = document.getElementById('authBtn');
        if (isConnected) {
            authBtn.textContent = 'Disconnect';
            authBtn.className = 'btn-secondary btn-sm btn-danger-text';
        } else {
            authBtn.textContent = 'Connect Drive';
            authBtn.className = 'btn-primary btn-sm';
            setSyncStatus("Offline", "");
        }
    }

    function handleAuthClick() {
        if (localStorage.getItem('has_linked_google') === 'true') {
            // DISCONNECT LOGIC
            if (accessToken) {
                // Tell Google to securely kill the live token
                google.accounts.oauth2.revoke(accessToken, () => { console.log('Access token revoked'); });
                accessToken = null;
            }
            // Wipe the browser memory
            localStorage.setItem('has_linked_google', 'false');
            localStorage.removeItem('google_access_token');
            localStorage.removeItem('google_token_expiry');
            updateAuthUI(false);
        } else {
            // CONNECT LOGIC
            if (!gapiInited || !gisimInited) return alert("System booting. Please retry in a moment.");
            setSyncStatus("Connecting...", "active");
            tokenClient.requestAccessToken({ prompt: 'select_account consent' });
        }
    }
    async function pullAndMergeCloudData() {
        if (!accessToken) return;
        try {
            const response = await gapi.client.drive.files.list({
                q: "name = 'todo_backup.json' and trashed = false",
                spaces: 'appDataFolder',
                fields: 'files(id, name)'
            });
            
            const files = response.result.files;
            cloudFileId = files.length > 0 ? files[0].id : null;

            if (cloudFileId) {
                const fileData = await gapi.client.drive.files.get({ fileId: cloudFileId, alt: 'media' });
                const remotePayload = fileData.result;

                // Look for the generic "records" array
                if (remotePayload && remotePayload.records) {
                    const cloudRecords = remotePayload.records;
                    const mergedMap = new Map();
                    
                    // 1. Load Cloud Envelopes into the Map
                    cloudRecords.forEach(item => mergedMap.set(item.id, item));
                    
                    // 2. Compare Local Envelopes vs Cloud Envelopes item-by-item
                    let localHasNewerEdits = false;
                    databaseArray.forEach(localItem => {
                        const cloudItem = mergedMap.get(localItem.id);
                        // If local item is newer, or it doesn't exist in the cloud yet, local wins
                        if (!cloudItem || (localItem.updatedAt > (cloudItem.updatedAt || 0))) {
                            mergedMap.set(localItem.id, localItem);
                            localHasNewerEdits = true;
                        }
                    });
                    
                    // Update our screen with the perfectly merged data
                    const finalMergedRecords = Array.from(mergedMap.values());
                    updateDataState(finalMergedRecords, true);
                    
                    if (localHasNewerEdits) await autoUploadToCloud();
                }
            } else {
                await autoUploadToCloud();
            }
            setSyncStatus("Cloud Synced ✅", "active");
        } catch (err) {
            console.error("Sync pull execution exception:", err);
            if (err.status === 401) handleAuthFailure();
        }
    }

    async function autoUploadToCloud() {
        if (localStorage.getItem('has_linked_google') !== 'true' || !accessToken) return;
        setSyncStatus("Saving to Cloud...", "active");
        
        try {
            if (!cloudFileId) {
                const response = await gapi.client.drive.files.list({
                    q: "name = 'todo_backup.json' and trashed = false",
                    spaces: 'appDataFolder',
                    fields: 'files(id)'
                });
                if (response.result.files.length > 0) {
                    cloudFileId = response.result.files[0].id;
                } else {
                    const metaResp = await gapi.client.drive.files.create({
                        resource: { name: 'todo_backup.json', parents: ['appDataFolder'] },
                        fields: 'id'
                    });
                    cloudFileId = metaResp.result.id;
                }
            }
            
            // Upload the generic database array
            const payload = { records: databaseArray };

            await gapi.client.request({
                path: `https://www.googleapis.com/upload/drive/v3/files/${cloudFileId}?uploadType=media`,
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            setSyncStatus("Cloud Synced ✅", "active");
        } catch (err) {
            console.error("Cloud engine commit intercept:", err);
            setSyncStatus("Sync Paused ⚠️", "error");
            if (err.status === 401) handleAuthFailure();
        }
    }
    // =========================================================================
    // SECTION 3: MICRO-INTERACTION SYNC ENGINE (OPTION 4)
    // =========================================================================
    
    // Set the initial clock so it doesn't double-trigger on first load
    let lastInteractionSyncTime = Date.now(); 
    const SYNC_COOLDOWN_MS = 300000; // 15 seconds cooldown

    function handleMicroInteraction() {
        // Stop completely if the user is not logged in or the token is missing
        if (localStorage.getItem('has_linked_google') !== 'true' || !accessToken) return;

        const now = Date.now();
        // If 15 seconds have passed since the last interaction check
        if (now - lastInteractionSyncTime > SYNC_COOLDOWN_MS) {
            lastInteractionSyncTime = now; // Reset the clock immediately
            
            // Trigger the background pull
            setSyncStatus("Checking...", "active");
            pullAndMergeCloudData();
        }
    }

    // Listeners for physical user presence and tab focus
    window.addEventListener('mousemove', handleMicroInteraction);
    window.addEventListener('keydown', handleMicroInteraction);
    window.addEventListener('touchstart', handleMicroInteraction, { passive: true });
    window.addEventListener('focus', handleMicroInteraction);
</script>
</body>
</html>
