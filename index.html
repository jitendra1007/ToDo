<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Cloud To-Do Checklist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
            --danger: #dc2626;
            --radius: 8px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--background); color: var(--text); line-height: 1.5; padding: 2rem 1rem; }
        .container { max-width: 800px; margin: 0 auto; background: var(--surface); padding: 2rem; border-radius: var(--radius); box-shadow: var(--shadow); }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        h1 { font-size: 1.75rem; font-weight: 700; }
        
        .header-badges { display: flex; gap: 0.5rem; align-items: center; }
        .metric-badge { background-color: #fee2e2; color: var(--danger); padding: 0.5rem 1rem; border-radius: 9999px; font-weight: 600; font-size: 0.875rem; }
        
        /* Sync Status Banner Component */
        .sync-status { font-size: 0.825rem; font-weight: 500; padding: 0.4rem 0.8rem; border-radius: 6px; display: inline-flex; align-items: center; gap: 0.4rem; background-color: #f1f5f9; color: var(--text-muted); }
        .sync-status.active { background-color: #e0f2fe; color: #0369a1; }
        .sync-status.error { background-color: #fef2f2; color: var(--danger); }

        .controls { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .input-group { flex: 1; display: flex; gap: 0.5rem; min-width: 280px; }
        
        input[type="text"] { flex: 1; padding: 0.625rem 1rem; border: 1px solid var(--border); border-radius: var(--radius); font-family: inherit; font-size: 0.95rem; outline: none; }
        input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        button { padding: 0.625rem 1.25rem; border-radius: var(--radius); font-family: inherit; font-size: 0.95rem; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: var(--surface); color: var(--text-muted); border: 1px solid var(--border); }
        .btn-secondary:hover { background-color: var(--background); color: var(--text); }
        .btn-danger { background-color: transparent; color: var(--text-muted); padding: 0.375rem 0.75rem; }
        .btn-danger:hover { color: var(--danger); background-color: #fef2f2; }
        
        .data-actions { display: flex; gap: 0.5rem; margin-left: auto; }
        #importFile { display: none; }

        .table-container { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem; }
        th, td { padding: 1rem; border-bottom: 1px solid var(--border); }
        th { background-color: var(--background); color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
        tr:last-child td { border-bottom: none; }

        .col-status { width: 60px; text-align: center; }
        .col-task { width: auto; }
        .col-actions { width: 100px; text-align: right; }

        .checkbox-container { display: inline-flex; justify-content: center; align-items: center; position: relative; cursor: pointer; }
        .checkbox-container input { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }
        .checkmark { height: 20px; width: 20px; background-color: #fff; border: 2px solid var(--border); border-radius: 4px; transition: all 0.2s; display: inline-block; position: relative; }
        .checkbox-container:hover input ~ .checkmark { border-color: var(--primary); }
        .checkbox-container input:checked ~ .checkmark { background-color: var(--success); border-color: var(--success); }
        .checkmark:after { content: ""; position: absolute; display: none; left: 6px; top: 2px; width: 5px; height: 10px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
        .checkbox-container input:checked ~ .checkmark:after { display: block; }

        tr.completed .task-text { text-decoration: line-through; color: var(--text-muted); }
        tr.completed { background-color: #fafafa; }
        .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }

        @media (max-width: 640px) {
            body { padding: 1rem 0.5rem; }
            .container { padding: 1rem; }
            .controls { flex-direction: column; }
            .input-group { width: 100%; }
            .data-actions { width: 100%; justify-content: space-between; }
            .data-actions button { flex: 1; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>To-Do Checklist</h1>
            <div id="syncStatusIndicator" class="sync-status">Local Mode</div>
        </div>
        <div class="header-badges">
            <div class="metric-badge"><span id="incompleteCount">0</span> remaining</div>
        </div>
    </header>

    <div class="controls">
        <form class="input-group" id="todoForm" onsubmit="addTask(event)">
            <input type="text" id="taskInput" placeholder="Add a new task..." required autocomplete="off">
            <button type="submit" class="btn-primary">Add Task</button>
        </form>
        
        <div class="data-actions">
            <button class="btn-secondary" onclick="exportData()">Export</button>
            <button class="btn-secondary" onclick="document.getElementById('importFile').click()">Import</button>
            <button class="btn-primary" id="googleSyncControlBtn" onclick="handleSyncControlClick()">Enable Backup & Sync</button>
            <input type="file" id="importFile" accept=".json" onchange="importData(event)">
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="col-status">Done</th>
                    <th class="col-task">Task Description</th>
                    <th class="col-actions">Actions</th>
                </tr>
            </thead>
            <tbody id="todoTableBody"></tbody>
        </table>
        <div id="emptyState" class="empty-state" style="display: none;">No tasks found.</div>
    </div>
</div>

<script>
    // =========================================================================
    // SECTION 1: CORE APPLICATION STATE & LOCAL DOM ENGINE
    // =========================================================================
    let todos = [];

    // Local execution instantly pulls from disk cache 
    document.addEventListener('DOMContentLoaded', () => {
        const storedTodos = localStorage.getItem('browser_checklist_tasks');
        if (storedTodos) {
            try { todos = JSON.parse(storedTodos); } catch (e) { todos = []; }
        }
        render();
    });

    function saveToLocalStorage() {
        localStorage.setItem('browser_checklist_tasks', JSON.stringify(todos));
    }

    function render() {
        const tbody = document.getElementById('todoTableBody');
        const emptyState = document.getElementById('emptyState');
        tbody.innerHTML = '';

        if (todos.length === 0) {
            emptyState.style.display = 'block';
        } else {
            emptyState.style.display = 'none';
            todos.forEach(todo => {
                const tr = document.createElement('tr');
                if (todo.completed) tr.classList.add('completed');
                tr.innerHTML = `
                    <td class="col-status">
                        <label class="checkbox-container">
                            <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTask('${todo.id}')">
                            <span class="checkmark"></span>
                        </label>
                    </td>
                    <td class="col-task"><span class="task-text">${escapeHTML(todo.text)}</span></td>
                    <td class="col-actions"><button class="btn-danger" onclick="deleteTask('${todo.id}')">Delete</button></td>
                `;
                tbody.appendChild(tr);
            });
        }
        updateMetric();
    }

    function updateMetric() {
        document.getElementById('incompleteCount').textContent = todos.filter(t => !t.completed).length;
    }

    // Intercept mutations to instantly save locally + automatically broadcast changes upstream
    function addTask(event) {
        event.preventDefault();
        const input = document.getElementById('taskInput');
        const text = input.value.trim();
        if (!text) return;

        todos.push({ id: Date.now().toString(36) + Math.random().toString(36).substr(2, 5), text, completed: false });
        saveToLocalStorage();
        render();
        input.value = '';
        autoUploadToCloud();
    }

    function toggleTask(id) {
        todos = todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
        saveToLocalStorage();
        render();
        autoUploadToCloud();
    }

    function deleteTask(id) {
        todos = todos.filter(t => t.id !== id);
        saveToLocalStorage();
        render();
        autoUploadToCloud();
    }

    function exportData() {
        if (!todos.length) return alert("No data to export.");
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(todos, null, 2));
        const a = document.createElement('a'); a.setAttribute("href", dataStr); a.setAttribute("download", "todo_export.json"); a.click();
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const parsed = JSON.parse(e.target.result);
                if (Array.isArray(parsed)) { todos = parsed; saveToLocalStorage(); render(); autoUploadToCloud(); }
            } catch(err) { alert("Invalid JSON file."); }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
    }

    // =========================================================================
    // SECTION 2: AUTOMATED SILENT GOOGLE CLOUD SYNC ENGINE
    // =========================================================================
    const CLIENT_ID = '305632493984-9q07n0i677ku1btdds1scke8pam5ag3s.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.appdata';

    let tokenClient;
    let gapiInited = false;
    let gisInited = false;
    let accessToken = null;

    function setSyncStatus(text, type = '') {
        const el = document.getElementById('syncStatusIndicator');
        el.innerText = text;
        el.className = 'sync-status ' + type;
    }

    // GAPI Client Initialization
    function gapiLoaded() {
        gapi.load('client', async () => {
            await gapi.client.init({ discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] });
            gapiInited = true;
            checkAndStartAuthEngine();
        });
    }

    // GIS Client Setup
    function gisLoaded() {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPES,
            callback: async (resp) => {
                if (resp.error !== undefined) {
                    setSyncStatus("Sync Paused ❌", "error");
                    throw resp;
                }
                accessToken = resp.access_token;
                localStorage.setItem('has_linked_google', 'true');
                document.getElementById('googleSyncControlBtn').innerText = "Disconnect Sync";
                document.getElementById('googleSyncControlBtn').className = "btn-secondary";
                
                setSyncStatus("Syncing...", "active");
                await pullAndMergeCloudData();
            },
        });
        gisInited = true;
        checkAndStartAuthEngine();
    }

    window.addEventListener('load', () => { gapiLoaded(); gisLoaded(); });

    // The Controller evaluating the architectural state on load
    function checkAndStartAuthEngine() {
        if (!gapiInited || !gisInited) return;

        // Verify if user previously opted into backing data up to their account
        if (localStorage.getItem('has_linked_google') === 'true') {
            setSyncStatus("Connecting...", "active");
            // SILENT SESSION RESTORATION: Request access token without popping up a UI window
            tokenClient.requestAccessToken({ prompt: 'none' });
        } else {
            setSyncStatus("Local Mode");
            document.getElementById('googleSyncControlBtn').innerText = "Enable Backup & Sync";
            document.getElementById('googleSyncControlBtn').className = "btn-primary";
        }
    }

    function handleSyncControlClick() {
        if (localStorage.getItem('has_linked_google') === 'true') {
            // Disconnect routine
            localStorage.removeItem('has_linked_google');
            accessToken = null;
            setSyncStatus("Local Mode");
            document.getElementById('googleSyncControlBtn').innerText = "Enable Backup & Sync";
            document.getElementById('googleSyncControlBtn').className = "btn-primary";
        } else {
            // Explicit user intent click - prompts for full interactive permission consent popup
            tokenClient.requestAccessToken({ prompt: 'consent' });
        }
    }

    // AUTOMATED SYSTEM TRIGGER: Download & Combine
    async function pullAndMergeCloudData() {
        if (!accessToken) return;
        try {
            const response = await gapi.client.drive.files.list({ q: "name = 'todo_backup.json'", spaces: 'appDataFolder', fields: 'files(id, name)' });
            const files = response.result.files;
            let fileId = files.length > 0 ? files[0].id : null;

            if (fileId) {
                const fileData = await gapi.client.drive.files.get({ fileId: fileId, alt: 'media' });
                const remoteTodos = fileData.result;
                
                if (Array.isArray(remoteTodos)) {
                    // Smart symmetric structural deduplication map matching via ID
                    const localMap = new Map(todos.map(item => [item.id, item]));
                    remoteTodos.forEach(item => localMap.set(item.id, item));
                    todos = Array.from(localMap.values());
                    
                    saveToLocalStorage();
                    render();
                }
            }
            // Immediately chain structural match reflection upstream to finalize consistency
            await uploadDataPayload(fileId);
            setSyncStatus("Cloud Synced ✅", "active");
        } catch (err) {
            // Handle silent session expiration cleanly
            if (err.status === 401 || err.error === "immediate_failed") {
                setSyncStatus("Reconnecting...", "active");
                tokenClient.requestAccessToken({ prompt: 'none' }); // attempt single retry silently
            } else {
                console.error(err);
                setSyncStatus("Sync Error", "error");
            }
        }
    }

    // AUTOMATED ACTION HOOK: Fires transparently whenever task arrays morph locally
    async function autoUploadToCloud() {
        if (localStorage.getItem('has_linked_google') !== 'true' || !accessToken) return;
        setSyncStatus("Saving to Cloud...", "active");
        try {
            const response = await gapi.client.drive.files.list({ q: "name = 'todo_backup.json'", spaces: 'appDataFolder', fields: 'files(id, name)' });
            const files = response.result.files;
            let fileId = files.length > 0 ? files[0].id : null;
            await uploadDataPayload(fileId);
            setSyncStatus("Cloud Synced ✅", "active");
        } catch (err) {
            console.error("Auto upload failed:", err);
            setSyncStatus("Sync Paused ⚠️", "error");
        }
    }

    // Multipart Request execution wrapper
    async function uploadDataPayload(fileId) {
        const boundary = 'foo_bar_baz';
        const delimiter = "\r\n--" + boundary + "\r\n";
        const close_delim = "\r\n--" + boundary + "--";
        const metadata = { 'name': 'todo_backup.json', 'parents': ['appDataFolder'] };

        const multipartRequestBody =
            delimiter + 'Content-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) +
            delimiter + 'Content-Type: application/json\r\n\r\n' + JSON.stringify(todos) + close_delim;

        await gapi.client.request({
            'path': !fileId ? '/upload/drive/v3/files' : `/upload/drive/v3/files/${fileId}`,
            'method': !fileId ? 'POST' : 'PATCH',
            'params': { 'uploadType': 'multipart' },
            'headers': { 'Content-Type': `multipart/related; boundary="${boundary}"` },
            'body': multipartRequestBody
        });
    }
</script>
</body>
</html>
