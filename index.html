<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud To-Do Checklist</title>
    <script src="https://apis.google.com/js/api.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --danger: #dc2626;
            --bg-color: #f8fafc;
            --text-main: #334155;
            --border: #e2e8f0;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        
        /* Headers & Banners */
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 1rem; margin-bottom: 2rem; }
        #syncStatus { font-size: 0.875rem; padding: 0.25rem 0.75rem; border-radius: 99px; background: #f1f5f9; }
        .status-active { background: #dcfce7 !important; color: #166534; }
        
        /* Inputs & Buttons */
        .input-group { display: flex; gap: 1rem; margin-bottom: 2rem; }
        input[type="text"] { flex: 1; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }
        button { padding: 0.75rem 1.5rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-danger { background: white; color: var(--danger); border: 1px solid var(--danger); padding: 0.25rem 0.75rem; }
        .btn-danger:hover { background: #fef2f2; }
        
        /* Secondary Actions Layout */
        .data-actions { display: flex; gap: 1rem; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border); }
        .btn-secondary { background: white; border: 1px solid var(--border); color: var(--text-main); }
        .btn-secondary:hover { background: #f1f5f9; }
        .btn-danger-text { color: var(--danger); }
        .btn-danger-text:hover { border-color: var(--danger); background: #fef2f2; }
        #importFile { display: none; }

        /* Table & Checkboxes */
        table { width: 100%; border-collapse: collapse; }
        td { padding: 1rem 0; border-bottom: 1px solid var(--border); }
        .col-status { width: 40px; }
        .col-actions { width: 80px; text-align: right; }
        .completed .task-text { text-decoration: line-through; color: #94a3b8; }
        
        /* Auth Screen */
        #authScreen { text-align: center; padding: 3rem 0; }
        .policy-links { margin-top: 2rem; font-size: 0.875rem; }
        .policy-links a { color: var(--primary); text-decoration: none; margin: 0 1rem; }
        .policy-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="authScreen">
        <h2>Welcome to Cloud To-Do</h2>
        <p>Please connect your Google Drive to enable cloud sync.</p>
        <button class="btn-primary" onclick="handleAuthClick()">Connect Google Drive</button>
        
        <div class="policy-links">
            <a href="privacy.html" target="_blank">Privacy Policy</a>
            <a href="terms.html" target="_blank">Terms of Service</a>
        </div>
    </div>

    <div id="appScreen" style="display: none;">
        <div class="header-flex">
            <div>
                <h2 style="margin:0;">Task Checklist</h2>
                <small>Pending: <span id="incompleteCount">0</span></small>
            </div>
            <div id="syncStatus">Waiting...</div>
        </div>

        <form class="input-group" onsubmit="addTask(event)">
            <input type="text" id="taskInput" placeholder="What needs to be done?" required>
            <button type="submit" class="btn-primary">Add Task</button>
        </form>

        <table>
            <tbody id="todoTableBody"></tbody>
        </table>
        <p id="emptyState" style="text-align:center; color:#94a3b8; display:none;">No active tasks found.</p>

        <div class="data-actions">
            <button class="btn-secondary" onclick="exportData()">Export JSON</button>
            <button class="btn-secondary" onclick="document.getElementById('importFile').click()">Import JSON</button>
            <input type="file" id="importFile" accept=".json" onchange="importData(event)">
            <button class="btn-secondary btn-danger-text" onclick="clearAllData()">Clear Data</button>
            <button class="btn-secondary" onclick="handleSignoutClick()" style="margin-left: auto;">Sign Out</button>
        </div>
    </div>
</div>

<script>
    // =========================================================================
    // GOOGLE API CONFIGURATION
    // Replace these with your actual Client ID and API Key from Google Console
    // =========================================================================
    const CLIENT_ID = 'YOUR_CLIENT_ID_HERE.apps.googleusercontent.com';
    const API_KEY = 'YOUR_API_KEY_HERE';
    const DISCOVERY_DOCS = ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"];
    const SCOPES = 'https://www.googleapis.com/auth/drive.appdata';

    // =========================================================================
    // SECTION 1: GLOBAL STATE & STORAGE
    // =========================================================================
    let databaseArray = []; // Generic Envelope Array
    let accessToken = null;
    let cloudFileId = null;

    // Load generic data from local memory on startup
    const storedData = localStorage.getItem('generic_app_data');
    if (storedData) {
        databaseArray = JSON.parse(storedData);
    }

    function updateDataState(newData, skipRender = false) {
        databaseArray = newData;
        localStorage.setItem('generic_app_data', JSON.stringify(databaseArray));
        if (!skipRender) render();
    }

    function setSyncStatus(text, statusClass) {
        const el = document.getElementById('syncStatus');
        el.textContent = text;
        if (statusClass === 'active') el.classList.add('status-active');
        else el.classList.remove('status-active');
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
    }

    // =========================================================================
    // SECTION 2: APPLICATION LAYER (UI & LOGIC)
    // =========================================================================
    function render() {
        const tbody = document.getElementById('todoTableBody');
        const emptyState = document.getElementById('emptyState');
        tbody.innerHTML = '';

        // Unpack Envelopes: Filter for 'tasks' table and NOT deleted
        const visibleTasks = databaseArray.filter(record => record.table === 'tasks' && !record.deleted);

        if (visibleTasks.length === 0) {
            emptyState.style.display = 'block';
        } else {
            emptyState.style.display = 'none';
            visibleTasks.forEach(record => {
                const taskData = record.data; // Open envelope for UI data
                
                const tr = document.createElement('tr');
                if (taskData.completed) tr.classList.add('completed');
                tr.innerHTML = `
                    <td class="col-status">
                        <input type="checkbox" ${taskData.completed ? 'checked' : ''} onchange="toggleTask('${record.id}')">
                    </td>
                    <td class="col-task"><span class="task-text">${escapeHTML(taskData.text)}</span></td>
                    <td class="col-actions"><button class="btn-danger" onclick="deleteTask('${record.id}')">Delete</button></td>
                `;
                tbody.appendChild(tr);
            });
        }
        document.getElementById('incompleteCount').textContent = visibleTasks.filter(r => !r.data.completed).length;
    }

    function addTask(event) {
        event.preventDefault();
        const input = document.getElementById('taskInput');
        const text = input.value.trim();
        if (!text) return;

        // Pack Envelope
        databaseArray.push({
            id: "tsk_" + Date.now().toString(36) + Math.random().toString(36).substr(2, 5),
            table: "tasks", 
            updatedAt: Date.now(), 
            deleted: false,
            data: { text: text, completed: false }
        });
        
        updateDataState(databaseArray);
        input.value = '';
        autoUploadToCloud();
    }

    function toggleTask(id) {
        databaseArray = databaseArray.map(record => 
            record.id === id 
                ? { ...record, updatedAt: Date.now(), data: { ...record.data, completed: !record.data.completed } } 
                : record
        );
        updateDataState(databaseArray);
        autoUploadToCloud();
    }

    function deleteTask(id) {
        databaseArray = databaseArray.map(record => 
            record.id === id ? { ...record, deleted: true, updatedAt: Date.now() } : record
        );
        updateDataState(databaseArray);
        autoUploadToCloud();
    }

    function clearAllData() {
        if (!confirm("Are you sure? This will clear all tasks across all your devices.")) return;
        
        // Instead of deleting the array, we soft-delete everything so the cloud knows to delete them too
        databaseArray = databaseArray.map(record => ({ ...record, deleted: true, updatedAt: Date.now() }));
        updateDataState(databaseArray);
        autoUploadToCloud();
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(databaseArray, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'todo_backup_export.json';
        a.click();
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                if (Array.isArray(imported)) {
                    // Update imported items with new timestamps so they win the merge
                    const refreshedData = imported.map(record => ({...record, updatedAt: Date.now()}));
                    updateDataState(refreshedData);
                    autoUploadToCloud();
                    alert("Import successful!");
                }
            } catch (err) {
                alert("Invalid JSON file");
            }
        };
        reader.readAsText(file);
    }

    // =========================================================================
    // SECTION 3: GENERIC SYNC LAYER (GOOGLE DRIVE)
    // =========================================================================
    async function pullAndMergeCloudData() {
        if (!accessToken) return;
        try {
            const response = await gapi.client.drive.files.list({
                q: "name = 'todo_backup.json' and trashed = false",
                spaces: 'appDataFolder',
                fields: 'files(id)'
            });
            
            const files = response.result.files;
            cloudFileId = files.length > 0 ? files[0].id : null;

            if (cloudFileId) {
                const fileData = await gapi.client.drive.files.get({ fileId: cloudFileId, alt: 'media' });
                const remotePayload = fileData.result;
                
                if (remotePayload && remotePayload.records) {
                    const cloudRecords = remotePayload.records;
                    const mergedMap = new Map();
                    
                    cloudRecords.forEach(item => mergedMap.set(item.id, item));
                    
                    let localHasNewerEdits = false;
                    databaseArray.forEach(localItem => {
                        const cloudItem = mergedMap.get(localItem.id);
                        if (!cloudItem || (localItem.updatedAt && localItem.updatedAt > (cloudItem.updatedAt || 0))) {
                            mergedMap.set(localItem.id, localItem);
                            localHasNewerEdits = true;
                        }
                    });
                    
                    const finalMergedRecords = Array.from(mergedMap.values());
                    updateDataState(finalMergedRecords);
                    
                    if (localHasNewerEdits) await autoUploadToCloud();
                }
            } else {
                await autoUploadToCloud();
            }
            setSyncStatus("Cloud Synced ✅", "active");
        } catch (err) {
            console.error("Sync pull error:", err);
            if (err.status === 401) handleAuthFailure();
        }
    }

    async function autoUploadToCloud() {
        if (!accessToken) return;
        setSyncStatus("Syncing...", "");

        const fileContent = JSON.stringify({ records: databaseArray });
        const file = new Blob([fileContent], { type: 'application/json' });
        const metadata = { name: 'todo_backup.json', parents: ['appDataFolder'] };
        const form = new FormData();
        form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
        form.append('file', file);

        try {
            const url = cloudFileId 
                ? `https://www.googleapis.com/upload/drive/v3/files/${cloudFileId}?uploadType=multipart`
                : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
            const method = cloudFileId ? 'PATCH' : 'POST';

            await fetch(url, {
                method: method,
                headers: { 'Authorization': 'Bearer ' + accessToken },
                body: form
            });
            setSyncStatus("Cloud Synced ✅", "active");
        } catch (err) {
            setSyncStatus("Sync Failed ❌", "");
        }
    }

    // =========================================================================
    // SECTION 4: MICRO-INTERACTION SYNC ENGINE
    // =========================================================================
    let lastInteractionSyncTime = Date.now(); 
    const SYNC_COOLDOWN_MS = 15000; // 15 seconds

    function handleMicroInteraction() {
        if (localStorage.getItem('has_linked_google') !== 'true' || !accessToken) return;
        const now = Date.now();
        if (now - lastInteractionSyncTime > SYNC_COOLDOWN_MS) {
            lastInteractionSyncTime = now;
            setSyncStatus("Checking...", "");
            pullAndMergeCloudData();
        }
    }

    window.addEventListener('mousemove', handleMicroInteraction);
    window.addEventListener('keydown', handleMicroInteraction);
    window.addEventListener('touchstart', handleMicroInteraction, { passive: true });
    window.addEventListener('focus', handleMicroInteraction); 

    // =========================================================================
    // SECTION 5: GOOGLE AUTHENTICATION INIT
    // =========================================================================
    function initClient() {
        gapi.client.init({
            apiKey: API_KEY,
            clientId: CLIENT_ID,
            discoveryDocs: DISCOVERY_DOCS,
            scope: SCOPES
        }).then(() => {
            const authInstance = gapi.auth2.getAuthInstance();
            authInstance.isSignedIn.listen(updateSigninStatus);
            updateSigninStatus(authInstance.isSignedIn.get());
        }).catch(err => console.error("Auth Init Error", err));
    }

    function updateSigninStatus(isSignedIn) {
        if (isSignedIn) {
            const user = gapi.auth2.getAuthInstance().currentUser.get();
            accessToken = user.getAuthResponse().access_token;
            localStorage.setItem('has_linked_google', 'true');
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'block';
            render();
            pullAndMergeCloudData(); // Initial load sync
        } else {
            handleAuthFailure();
        }
    }

    function handleAuthClick() { gapi.auth2.getAuthInstance().signIn(); }
    function handleSignoutClick() { gapi.auth2.getAuthInstance().signOut(); }
    
    function handleAuthFailure() {
        accessToken = null;
        localStorage.setItem('has_linked_google', 'false');
        document.getElementById('authScreen').style.display = 'block';
        document.getElementById('appScreen').style.display = 'none';
    }

    window.onload = () => {
        render(); // Render offline cache immediately
        gapi.load('client:auth2', initClient);
    };
</script>

</body>
</html>
